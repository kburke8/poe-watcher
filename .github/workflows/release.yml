name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (select auto to detect from commits)'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  version:
    # Skip if the push commit is a version bump (prevent infinite loop)
    # head_commit is null for workflow_dispatch, so those always run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      skipped: ${{ steps.bump.outputs.skipped }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Determine version bump
        id: bump
        shell: bash
        run: |
          # Get the latest version tag
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found, using v0.0.0 as base"
            LATEST_TAG="v0.0.0"
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
          fi

          CURRENT_VERSION="${LATEST_TAG#v}"
          echo "Current version: $CURRENT_VERSION"

          # Determine bump type
          BUMP_TYPE="${{ github.event.inputs.bump }}"

          # Treat 'auto' or empty as auto-detect
          if [ "$BUMP_TYPE" = "auto" ] || [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE=""
          fi

          if [ -z "$BUMP_TYPE" ]; then
            echo "Auto-detecting bump type from commits in $COMMIT_RANGE..."

            COMMITS=$(git log "$COMMIT_RANGE" --pretty=format:"%s%n%b" 2>/dev/null || git log --pretty=format:"%s%n%b")

            HAS_BREAKING=false
            HAS_FEAT=false
            HAS_FIX=false

            while IFS= read -r line; do
              # Check for breaking changes
              if echo "$line" | grep -qiE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE"; then
                HAS_BREAKING=true
              fi
              # Check for features
              if echo "$line" | grep -qE "^feat(\(.+\))?:"; then
                HAS_FEAT=true
              fi
              # Check for fixes and other patch-level changes
              if echo "$line" | grep -qE "^(fix|perf|refactor)(\(.+\))?:"; then
                HAS_FIX=true
              fi
            done <<< "$COMMITS"

            if [ "$HAS_BREAKING" = true ]; then
              BUMP_TYPE="major"
            elif [ "$HAS_FEAT" = true ]; then
              BUMP_TYPE="minor"
            elif [ "$HAS_FIX" = true ]; then
              BUMP_TYPE="patch"
            else
              echo "No version-bumping commits found. Skipping release."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Bump type: $BUMP_TYPE"

          # Calculate new version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.bump.outputs.skipped != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        if: steps.bump.outputs.skipped != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Update version in all files
        if: steps.bump.outputs.skipped != 'true'
        shell: bash
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"

          # Update package.json and package-lock.json
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

          # Update tauri.conf.json (use jq for surgical top-level update)
          cd src-tauri
          jq --arg v "$NEW_VERSION" '.version = $v' tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp tauri.conf.json

          # Update Cargo.toml version (first occurrence under [package])
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$NEW_VERSION\"/" Cargo.toml

          # Update Cargo.lock - find the poe-watcher package entry and update its version
          sed -i "/^name = \"poe-watcher\"/{n;s/^version = \"[^\"]*\"/version = \"$NEW_VERSION\"/}" Cargo.lock

          cd ..

          echo "Updated all files to v$NEW_VERSION"
          echo "--- package.json ---"
          grep '"version"' package.json
          echo "--- tauri.conf.json ---"
          grep '"version"' src-tauri/tauri.conf.json
          echo "--- Cargo.toml ---"
          grep '^version' src-tauri/Cargo.toml
          echo "--- Cargo.lock (poe-watcher) ---"
          grep -A1 'name = "poe-watcher"' src-tauri/Cargo.lock | head -2

      - name: Commit and tag
        if: steps.bump.outputs.skipped != 'true'
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin HEAD:master --follow-tags

  build:
    needs: version
    if: >-
      needs.version.result == 'success' &&
      needs.version.outputs.skipped != 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: "v${{ needs.version.outputs.new_version }}"
          releaseName: "PoE Watcher v${{ needs.version.outputs.new_version }}"
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
